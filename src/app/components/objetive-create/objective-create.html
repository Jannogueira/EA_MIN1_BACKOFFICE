<!-- Navigation Header (Same as other create components) -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-primary-container/40 backdrop-blur-md border-b border-outline-variant/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]">
    <div class="flex items-center gap-4">
        <button class="flex items-center gap-2 text-on-surface-variant hover:text-secondary transition-colors px-3 py-1.5 rounded-lg hover:bg-surface-container-highest/50" [routerLink]="['/objetivos']">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="text-sm font-bold">Volver</span>
        </button>
    </div>
    <div class="absolute left-1/2 -translate-x-1/2">
        <span class="text-xl font-bold tracking-tight text-white">Backoffice</span>
    </div>
    <div class="flex items-center gap-4 invisible"></div>
</nav>

<div class="pt-16 min-h-screen flex items-center justify-center p-6 bg-background">
    <div class="w-full max-w-xl">
        <div class="bg-primary-container rounded-2xl p-8 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border border-outline-variant/30">
            <div class="mb-10 text-center">
                <h2 class="text-2xl font-bold text-white mb-2">Create New Objective</h2>
                <p class="text-on-surface-variant text-sm">Define a new target and assign an owner</p>
            </div>

            <form [formGroup]="objectiveForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- Name -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Objective Name</label>
                    <input type="text" formControlName="nombre" placeholder="Short title for the objective"
                           class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white">
                    <div *ngIf="objectiveForm.get('nombre')?.invalid && objectiveForm.get('nombre')?.touched" class="text-red-400 text-xs font-semibold pl-1">
                        Name is required.
                    </div>
                </div>

                <!-- Description -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Description</label>
                    <textarea formControlName="descripcion" rows="3" placeholder="Explain what needs to be achieved..."
                           class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white"></textarea>
                    <div *ngIf="objectiveForm.get('descripcion')?.invalid && objectiveForm.get('descripcion')?.touched" class="text-red-400 text-xs font-semibold pl-1">
                        Description is required.
                    </div>
                </div>

                <!-- Owner (User) -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-secondary uppercase tracking-widest pl-1">Assign Owner</label>
                    <select formControlName="usuario" 
                           class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:border-secondary focus:ring-4 focus:ring-secondary/10 rounded-xl py-3 px-4 text-sm transition-all outline-none text-white appearance-none">
                        <option value="" disabled selected>Select a user...</option>
                        <option *ngFor="let user of usuarios" [value]="user._id">
                            {{ user.nombre }} ({{ user.rol }})
                        </option>
                    </select>
                    <div *ngIf="objectiveForm.get('usuario')?.invalid && objectiveForm.get('usuario')?.touched" class="text-red-400 text-xs font-semibold pl-1">
                        Please assign an owner.
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" [disabled]="objectiveForm.invalid || isSubmitting"
                            class="w-full bg-gradient-to-br from-secondary to-primary-container text-on-secondary-fixed py-3.5 rounded-xl text-sm font-bold shadow-lg hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <span *ngIf="!isSubmitting">Create Objective</span>
                        <span *ngIf="isSubmitting">Saving target...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

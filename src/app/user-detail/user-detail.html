<div class="user-wrapper">
    <div class="user-container">
        <div class="user-card">
            <div class="user-header">
                <h2>Detalles del Usuario</h2>
                <p>Gestiona la información de la cuenta</p>
            </div>

            <form [formGroup]="userForm" class="user-form">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <div class="input-container">
                        <input type="text" id="nombre" formControlName="nombre" placeholder="Nombre completo"
                               [class.is-editing]="isEditing">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                        <input type="email" id="email" formControlName="email" placeholder="example@email.com"
                               [class.is-editing]="isEditing">
                    </div>
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <div class="input-container">
                        <select id="rol" formControlName="rol" [class.is-editing]="isEditing" class="custom-select">
                            <option value="user">Usuario</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="switch">
                        <input type="checkbox" formControlName="activo">
                        <span class="slider round"></span>
                    </label>
                    <span>Cuenta Activa</span>
                </div>

                <div class="form-actions">
                    <!-- Standard Edit Button -->
                    <button *ngIf="!isEditing" type="button" class="btn-edit" (click)="toggleEdit()">
                        Editar Perfil
                    </button>

                    <!-- Save and Cancel Buttons when editing -->
                    <div *ngIf="isEditing" class="edit-actions">
                        <button type="button" class="btn-cancel" (click)='cancelEdit()'>
                            Cancelar
                        </button>
                        <button type="submit" class="btn-save" [disabled]="userForm.invalid" (click)="saveChanges()">
                            Guardar Cambios
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
